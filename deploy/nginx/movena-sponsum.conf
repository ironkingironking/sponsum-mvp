# Movena Sponsum — include inside suite.movena.ch TLS server block
#   include /etc/nginx/snippets/movena-sponsum.conf;
#
# UI:  https://suite.movena.ch/sponsum/
# API: https://suite.movena.ch/api/sponsum/v1/*

location = /sponsum {
    return 301 /sponsum/;
}

location ^~ /sponsum/ {
    auth_request /oauth2/auth;
    error_page 401 = @movena_suite_oauth_start;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

    proxy_pass http://127.0.0.1:3088/sponsum/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header Authorization "";
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_set_header X-Auth-Request-Groups $auth_groups;
    proxy_set_header X-Movena-Tenant tenant-movena;
    proxy_set_header X-Movena-User $auth_email;
}

location ^~ /api/sponsum {
    auth_request /oauth2/auth;
    error_page 401 = @movena_suite_oauth_start;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

    proxy_pass http://127.0.0.1:3088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header Authorization "";
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_set_header X-Auth-Request-Groups $auth_groups;
    proxy_set_header X-Movena-Tenant tenant-movena;
    proxy_set_header X-Movena-User $auth_email;
}
